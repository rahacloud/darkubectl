      - id: mock-alert-critical-firing
        alertname: High CPU usage
        status: firing
        severity: critical
        instance: billing-api
        service_owner: platform
        condition: CPU > 90%
        alert_description: CPU usage exceeded the configured threshold.
        starts_at: '2026-11-19T09:48:00Z'
      - id: mock-alert-warning-firing
        alertname: Memory pressure
        status: firing
        severity: warning
        instance: gateway
        condition: Memory > 80%
        starts_at: '2026-11-19T09:53:00Z'
      - id: mock-alert-info-firing
        alertname: Replica count low
        status: firing
        severity: info
        instance: worker
        condition: Replicas < 2
        starts_at: '2026-11-19T09:56:00Z'
      - id: mock-alert-critical-resolved
        alertname: Database unavailable
        status: resolved
        severity: critical
        instance: postgres
        condition: Health check failed
        starts_at: '2026-11-19T07:59:00Z'
        ends_at: '2026-11-19T08:59:00Z'
      - id: mock-alert-warning-resolved
        alertname: Storage response slow
        status: resolved
        severity: warning
        instance: object-store
        condition: Latency > 2s
        starts_at: '2026-11-19T08:59:00Z'
        ends_at: '2026-11-19T09:14:00Z'
      - id: mock-alert-info-resolved
        alertname: Certificate renewed
        status: resolved
        severity: info
