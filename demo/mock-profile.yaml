version: 1
tenants:
  - name: demo-acme
    namespaces:
      - id: 101
        name: production
        cluster:
          id: 11
          name: demo-west
      - id: 202
        name: staging
        cluster:
          id: 12
          name: demo-east
      - id: 203
        name: preview
        cluster:
          id: 12
          name: demo-east
      - id: 204
        name: production
        cluster:
          id: 12
          name: demo-east
    apps:
      - id: app-api-prod
        name: api
        namespace:
          id: 101
          name: production
          cluster:
            id: 11
            name: demo-west
        state:
          type: healthy
          text: healthy (2/2)
          description: All replicas are ready
        replicas: 2
        creation_method: docker_image
        image_repo: registry.example.test/demo/api
        image_tag: v1.8.2
        ram_limit: 1000M
        cpu_request: 500m
        disk_size_in_gi: 10
        custom_domain_address: api.demo.example.test
        external_hosts:
          - api.public.demo.example.test
          - api-alt.public.demo.example.test
        service:
          type: LoadBalancer
          ports:
            http:
              containerPort: 8080
              servicePort: 80
              nodePort: 30421
              protocol: TCP
          internal_address: api.production.demo.svc
          external_address: app-api-prod.hsvc.example.test
          external_ip: 192.0.2.42
        readiness_probe_path: /healthz
        command: /app/server
        args: --port 8080
        inputs:
          - LOG_LEVEL
          - PUBLIC_BASE_URL
      - id: app-worker-prod
        name: worker
        namespace:
          id: 101
          name: production
          cluster:
            id: 11
            name: demo-west
        state:
          type: not_ready
          text: not ready (1/2)
          description: One replica is not ready
        replicas: 2
        creation_method: git_repo_url
        image_repo: registry.example.test/demo/worker
        image_tag: build-204
      - id: app-api-staging
        name: api
        namespace:
          id: 202
          name: staging
          cluster:
            id: 12
            name: demo-east
        state:
          type: healthy
          text: healthy (1/1)
          description: All replicas are ready
        replicas: 1
        creation_method: docker_image
        image_repo: registry.example.test/demo/api
        image_tag: v1.8.1
        custom_domain_address: api.staging.demo.example.test
  - name: demo-labs
    namespaces:
      - id: 301
        name: research
        cluster:
          id: 21
          name: demo-north
      - id: 302
        name: experiments
        cluster:
          id: 22
          name: demo-north
      - id: 303
        name: scratch
        cluster:
          id: 22
          name: demo-north
    apps:
      - id: app-notebook
        name: notebook
        namespace:
          id: 301
          name: research
          cluster:
            id: 21
            name: demo-north
        state:
          type: healthy
          text: healthy (1/1)
          description: All replicas are ready
        replicas: 1
        creation_method: docker_image
        image_repo: registry.example.test/labs/notebook
        image_tag: latest
      - id: app-api-labs
        name: api
        namespace:
          id: 302
          name: experiments
          cluster:
            id: 22
            name: demo-north
        state:
          type: degraded
          text: degraded (1/2)
          description: One replica is warming up
        replicas: 2
        creation_method: docker_image
        image_repo: registry.example.test/labs/api
        image_tag: canary
