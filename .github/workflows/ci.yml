name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      embedded: ${{ steps.filter.outputs.embedded }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          predicate-quantifier: some-with-excludes
          filters: |
            go:
              - '**'
              - '!**/*.md'
              - '!.gitignore'
              - '!.markdownlint.jsonc'
              - '!Makefile'
            embedded:
              - 'internal/agentsetup/instructions.md'
              - 'internal/agentsetup/skill.md'
            markdown:
              - '**/*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'

  lint:
    name: golangci-lint
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.go == 'true' || needs.changes.outputs.embedded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: build & test
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.go == 'true' || needs.changes.outputs.embedded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  markdown:
    name: markdownlint
    needs: changes
    if: >-
      !cancelled() && (needs.changes.result != 'success' ||
      needs.changes.outputs.markdown == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
