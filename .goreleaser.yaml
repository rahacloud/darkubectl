# GoReleaser configuration — https://goreleaser.com
version: 2

project_name: darkubectl

before:
  hooks:
    - go mod tidy

builds:
  - id: darkubectl
    main: .
    binary: darkubectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rahacloud/darkubectl/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

# Homebrew tap. Publishing needs a `rahacloud/homebrew-tap` repository and a
# HOMEBREW_TAP_GITHUB_TOKEN secret with `contents: write` on it — GITHUB_TOKEN
# only reaches this repository. `homebrew_casks` replaces the deprecated
# `brews` block (GoReleaser v2.10+); casks are macOS-only, Linux users take the
# tarball or `go install`.
homebrew_casks:
  - name: darkubectl
    binaries: [darkubectl]
    directory: Casks
    homepage: https://github.com/rahacloud/darkubectl
    description: kubectl-like access to the Hamravesh Darkube platform
    license: GPL-3.0
    # No tap secret configured yet? Generate the cask but do not try to push it,
    # so a release never fails on a missing HOMEBREW_TAP_GITHUB_TOKEN.
    # `index` returns "" for a key that is absent entirely, where
    # .Env.HOMEBREW_TAP_GITHUB_TOKEN would abort templating with
    # "map has no entry for key".
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: rahacloud
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        # The release binaries are unsigned, so macOS would otherwise quarantine
        # them and refuse the first run.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/darkubectl"]
          end

release:
  draft: false
  prerelease: auto
