# GoReleaser configuration — https://goreleaser.com
version: 2

project_name: darkubectl

before:
  hooks:
    - go mod tidy
    # Shell completion scripts, shipped in every archive and installed by the
    # cask and the AUR package. Generated from the binary so they cannot drift
    # from the command tree.
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run . completion "$s" > "completions/darkubectl.$s"; done'

builds:
  - id: darkubectl
    main: .
    binary: darkubectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rahacloud/darkubectl/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

# Homebrew tap. Publishing needs a `rahacloud/homebrew-tap` repository and a
# HOMEBREW_TAP_GITHUB_TOKEN secret with `contents: write` on it — GITHUB_TOKEN
# only reaches this repository. `homebrew_casks` replaces the deprecated
# `brews` block (GoReleaser v2.10+); casks are macOS-only, Linux users take the
# tarball or `go install`.
homebrew_casks:
  - name: darkubectl
    binaries: [darkubectl]
    completions:
      bash: completions/darkubectl.bash
      zsh: completions/darkubectl.zsh
      fish: completions/darkubectl.fish
    directory: Casks
    homepage: https://github.com/rahacloud/darkubectl
    description: kubectl-like access to the Hamravesh Darkube platform
    license: GPL-3.0
    # No tap secret configured yet? Generate the cask but do not try to push it,
    # so a release never fails on a missing HOMEBREW_TAP_GITHUB_TOKEN.
    # `index` returns "" for a key that is absent entirely, where
    # .Env.HOMEBREW_TAP_GITHUB_TOKEN would abort templating with
    # "map has no entry for key". It also returns "" for a key that is present
    # and empty, which is what the workflow produces when the secret is unset.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: rahacloud
      name: homebrew-tap
      # This one field takes ONLY `{{ .Env.VAR }}` — GoReleaser validates the
      # token template separately and rejects anything else with "expected
      # {{ .Env.VAR_NAME }} only (no plain-text or other interpolation)", which
      # is what failed the v0.5.0 release *after* it had already published every
      # binary. Safe despite the note above because the release workflow always
      # defines the variable, empty or not.
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The release binaries are unsigned, so macOS would otherwise quarantine
    # them and refuse the first run. This is a `custom_block` rather than
    # `hooks.post.install` because GoReleaser renders the hook as a Ruby
    # `postflight do` block, which Homebrew deprecated in favor of the
    # declarative `postflight_steps` ("Calling `postflight` is deprecated!" on
    # every install). Steps take literal arguments only, so the path is
    # Homebrew's own `{{staged_path}}` token — escaped here, since GoReleaser
    # runs this field through its template engine first.
    custom_block: |
      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/darkubectl"], must_succeed: false
          end
        end
      end

# AUR package `darkubectl-bin`, the Linux counterpart of the cask above. The
# package was created by hand at 0.6.0; from then on every tag regenerates its
# PKGBUILD and .SRCINFO and pushes them. Publishing needs an AUR_KEY secret
# holding the private key of an SSH key registered on the maintainer's AUR
# account, WITHOUT a passphrase — GoReleaser runs `ssh -i` non-interactively and
# has no way to supply one. Unset, the package is generated but not pushed, the
# same arrangement as HOMEBREW_TAP_GITHUB_TOKEN.
aurs:
  - name: darkubectl-bin
    ids: [default]
    homepage: https://github.com/rahacloud/darkubectl
    description: kubectl-like access to the Hamravesh Darkube platform
    license: GPL-3.0-only
    maintainers:
      - "Parham Alvani <parham.alvani@gmail.com>"
    provides: [darkubectl]
    conflicts: [darkubectl]
    skip_upload: '{{ if index .Env "AUR_KEY" }}false{{ else }}true{{ end }}'
    private_key: '{{ index .Env "AUR_KEY" }}'
    git_url: ssh://aur@aur.archlinux.org/darkubectl-bin.git
    commit_author:
      name: Parham Alvani
      email: parham.alvani@gmail.com
    commit_msg_template: "Update to {{ .Tag }}"
    package: |-
      install -Dm755 "./darkubectl" "${pkgdir}/usr/bin/darkubectl"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"
      install -Dm644 "./completions/darkubectl.bash" "${pkgdir}/usr/share/bash-completion/completions/darkubectl"
      install -Dm644 "./completions/darkubectl.zsh" "${pkgdir}/usr/share/zsh/site-functions/_darkubectl"
      install -Dm644 "./completions/darkubectl.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/darkubectl.fish"

release:
  draft: false
  prerelease: auto
