# GoReleaser configuration — https://goreleaser.com
version: 2

project_name: darkubectl

before:
  hooks:
    - go mod tidy

builds:
  - id: darkubectl
    main: .
    binary: darkubectl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rahacloud/darkubectl/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

# Homebrew tap. Publishing needs a `rahacloud/homebrew-tap` repository and a
# HOMEBREW_TAP_GITHUB_TOKEN secret with `contents: write` on it — GITHUB_TOKEN
# only reaches this repository. `homebrew_casks` replaces the deprecated
# `brews` block (GoReleaser v2.10+); casks are macOS-only, Linux users take the
# tarball or `go install`.
homebrew_casks:
  - name: darkubectl
    binaries: [darkubectl]
    directory: Casks
    homepage: https://github.com/rahacloud/darkubectl
    description: kubectl-like access to the Hamravesh Darkube platform
    license: GPL-3.0
    # No tap secret configured yet? Generate the cask but do not try to push it,
    # so a release never fails on a missing HOMEBREW_TAP_GITHUB_TOKEN.
    # `index` returns "" for a key that is absent entirely, where
    # .Env.HOMEBREW_TAP_GITHUB_TOKEN would abort templating with
    # "map has no entry for key". It also returns "" for a key that is present
    # and empty, which is what the workflow produces when the secret is unset.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: rahacloud
      name: homebrew-tap
      # This one field takes ONLY `{{ .Env.VAR }}` — GoReleaser validates the
      # token template separately and rejects anything else with "expected
      # {{ .Env.VAR_NAME }} only (no plain-text or other interpolation)", which
      # is what failed the v0.5.0 release *after* it had already published every
      # binary. Safe despite the note above because the release workflow always
      # defines the variable, empty or not.
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The release binaries are unsigned, so macOS would otherwise quarantine
    # them and refuse the first run. This is a `custom_block` rather than
    # `hooks.post.install` because GoReleaser renders the hook as a Ruby
    # `postflight do` block, which Homebrew deprecated in favor of the
    # declarative `postflight_steps` ("Calling `postflight` is deprecated!" on
    # every install). Steps take literal arguments only, so the path is
    # Homebrew's own `{{staged_path}}` token — escaped here, since GoReleaser
    # runs this field through its template engine first.
    custom_block: |
      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/darkubectl"], must_succeed: false
          end
        end
      end

release:
  draft: false
  prerelease: auto
