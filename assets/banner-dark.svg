<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="darkubectl — kubectl-like access to the Hamravesh Darkube platform">
  <title>darkubectl</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .wordmark  { fill: #E6EDF3; font-size: 62px; font-weight: 700; letter-spacing: -1px; }
      .tagline   { fill: #8B949E; font-size: 21px; }
      .chrome    { fill: #6E7681; font-size: 14px; }
      .prompt    { fill: #40C057; font-size: 19px; }
      .cmd       { fill: #E6EDF3; font-size: 19px; }
      .flag      { fill: #868E96; font-size: 19px; }
      .branch    { fill: #228BE6; font-size: 19px; font-weight: 700; }
      .th        { fill: #D6336C; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
      .td        { fill: #C9D1D9; font-size: 18px; }
      .ok        { fill: #40C057; font-size: 18px; }
      .warn      { fill: #E8590C; font-size: 18px; }
      .muted     { fill: #868E96; font-size: 18px; }
      .num       { fill: #F08C00; font-size: 18px; }
    </style>
  </defs>

  <!-- wordmark -->
  <text class="mono wordmark" x="640" y="78" text-anchor="middle">darkubectl</text>
  <text class="sans tagline" x="640" y="118" text-anchor="middle">kubectl-like access to the Hamravesh Darkube platform</text>

  <!-- terminal window -->
  <rect x="40" y="158" width="1200" height="344" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <path d="M40 198 L40 170 A12 12 0 0 1 52 158 L1228 158 A12 12 0 0 1 1240 170 L1240 198 Z" fill="#21262D"/>
  <line x1="40" y1="198" x2="1240" y2="198" stroke="#30363D" stroke-width="1"/>
  <circle cx="70" cy="178" r="6" fill="#FF5F57"/>
  <circle cx="92" cy="178" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="178" r="6" fill="#28C840"/>
  <text class="mono chrome" x="640" y="183" text-anchor="middle">darkubectl — talaland-dev</text>

  <!-- divider between the two panes -->
  <line x1="784" y1="222" x2="784" y2="478" stroke="#30363D" stroke-width="1"/>

  <!-- left pane: get apps -->
  <text class="mono" x="72" y="244"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">darkubectl get apps</tspan></text>
  <text class="mono branch" x="72" y="284">NAMESPACE: talaland-dev</text>

  <rect x="72" y="300" width="660" height="144" rx="6" fill="none" stroke="#5C5F77" stroke-width="1"/>
  <line x1="72" y1="338" x2="732" y2="338" stroke="#5C5F77" stroke-width="1"/>
  <line x1="272" y1="300" x2="272" y2="444" stroke="#5C5F77" stroke-width="1"/>
  <line x1="412" y1="300" x2="412" y2="444" stroke="#5C5F77" stroke-width="1"/>
  <line x1="576" y1="300" x2="576" y2="444" stroke="#5C5F77" stroke-width="1"/>

  <text class="mono th" x="88" y="325">NAME</text>
  <text class="mono th" x="288" y="325">STATE</text>
  <text class="mono th" x="428" y="325">REPLICAS</text>
  <text class="mono th" x="592" y="325">ENABLED</text>

  <text class="mono td" x="88" y="366">api</text>
  <text class="mono ok" x="288" y="366">Healthy</text>
  <text class="mono num" x="428" y="366">3</text>
  <text class="mono ok" x="592" y="366">true</text>

  <text class="mono td" x="88" y="400">worker</text>
  <text class="mono ok" x="288" y="400">Healthy</text>
  <text class="mono num" x="428" y="400">1</text>
  <text class="mono ok" x="592" y="400">true</text>

  <text class="mono td" x="88" y="434">redis-dev</text>
  <text class="mono muted" x="288" y="434">Pending</text>
  <text class="mono num" x="428" y="434">1</text>
  <text class="mono ok" x="592" y="434">true</text>

  <!-- right pane: get orphans + terminal -->
  <text class="mono" x="816" y="244"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">darkubectl get orphans</tspan></text>

  <text class="mono th" x="816" y="288">NAME</text>
  <text class="mono th" x="1030" y="288">KIND</text>
  <line x1="816" y1="300" x2="1200" y2="300" stroke="#30363D" stroke-width="1"/>

  <text class="mono td" x="816" y="330">masstransit-dev</text>
  <text class="mono warn" x="1030" y="330">orphaned</text>
  <text class="mono td" x="816" y="360">redis-dev</text>
  <text class="mono warn" x="1030" y="360">orphaned</text>
  <text class="mono td" x="816" y="390">sql-pad</text>
  <text class="mono muted" x="1030" y="390">no-workload</text>

  <text class="mono" x="816" y="440"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">darkubectl terminal app api</tspan></text>
  <text class="mono" x="816" y="472"><tspan class="branch">/app</tspan><tspan class="cmd" dx="10">#</tspan></text>
  <rect x="884" y="458" width="11" height="20" fill="#E6EDF3" opacity="0.85"/>
</svg>
